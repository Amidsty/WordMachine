# Match requirements-dev.txt. Tool upgrades are deliberate, not editor-dependent.
required-version = "==0.14.10"
target-version = "py310"
line-length = 100
preview = false
unsafe-fixes = false

[lint]
# Syntax/style errors, undefined/unused names, imports, likely bugs and stale suppressions.
# Not ALL: avoid unstable rule additions and formatter-conflicting style rules.
select = ["E4", "E7", "E9", "F", "I", "B", "RUF100"]

[lint.per-file-ignores]
# Historical 0001-0007 keep their import execution order; all other checks still apply.
# Future revisions must also satisfy import ordering.
"migrations/versions/000[1-7]_*.py" = ["I001"]

[lint.flake8-bugbear]
# Frozen dataclass containing only validated ints/str; sharing defaults is intentional.
extend-immutable-calls = ["wm_app.services.pagination.ListQuery"]

[format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
